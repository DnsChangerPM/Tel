# فایل موقت عیب‌یابی: analyze/test/build را اجرا می‌کند و خروجی را به‌صورت
# کامنت روی PR می‌فرستد (چون لاگ اکشن‌ها از بیرون قابل خواندن نیست).
# بعد از سبز شدن همه‌چیز حذف می‌شود.

name: CI debug (temporary)

on:
  push:
    tags:
      - 'dbg-*'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    name: check ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.5', '3.19.6']
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}

      - name: pub get
        run: flutter pub get > "pubget-${{ matrix.flutter }}.txt" 2>&1 || true

      - name: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > "analyze-${{ matrix.flutter }}.txt" 2>&1 || true
          echo "===== analyze ${{ matrix.flutter }} ====="
          cat "analyze-${{ matrix.flutter }}.txt"

      - name: test (هر فایل جدا، با محدودیت زمانی)
        continue-on-error: true
        run: |
          LOG="test-${{ matrix.flutter }}.txt"
          : > "$LOG"
          for f in test/*.dart; do
            echo "===== $f =====" >> "$LOG"
            timeout 300 flutter test "$f" --reporter expanded >> "$LOG" 2>&1 || echo "exit code: $?" >> "$LOG"
          done
          echo "===== test ${{ matrix.flutter }} ====="
          tail -120 "$LOG"

      - name: ارسال خروجی به‌صورت کامنت PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLUTTER_VERSION: ${{ matrix.flutter }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          flutter = os.environ['FLUTTER_VERSION']

          def read(name):
              try:
                  return open('%s-%s.txt' % (name, flutter), encoding='utf-8').read()
              except OSError:
                  return '(no output)'

          body = (
              '### Flutter %s\n\n**flutter analyze**\n\n```\n%s\n```\n\n'
              '**flutter test**\n\n```\n%s\n```\n'
          ) % (flutter, read('analyze')[:20000], read('test')[:30000])
          def post_comment(title, body):
              import json, os, urllib.request, urllib.error
              request = urllib.request.Request(
                  'https://api.github.com/repos/DnsChangerPM/Tel/issues/1/comments',
                  data=json.dumps({'body': body}).encode('utf-8'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                  },
                  method='POST')
              try:
                  with urllib.request.urlopen(request) as response:
                      print('comment posted:', response.status)
              except urllib.error.HTTPError as error:
                  print('comment failed:', error.code, error.read()[:300])

          post_comment('Flutter ' + flutter, body)
          PY

  build-android:
    name: build APK
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب جاوا ۲۱
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: نصب Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: کلید امضای آزمایشی (تا مسیر امضای release هم تست شود)
        run: |
          keytool -genkeypair -v -keystore android/tel-release.jks \
            -storepass telpass -keypass telpass -keyalg RSA -keysize 2048 \
            -validity 30 -alias tel -dname "CN=Tel CI" 2>&1 | tail -3
          printf 'storePassword=telpass\nkeyPassword=telpass\nkeyAlias=tel\nstoreFile=../tel-release.jks\n' > android/key.properties
          cat android/key.properties

      - name: ساخت APK
        continue-on-error: true
        run: |
          set +e
          flutter build apk --release \
            --build-name 0.0.1 --build-number 1 \
            --dart-define=TEL_APP_VERSION=0.0.1 > build-apk.txt 2>&1
          echo "exit code: $?" >> build-apk.txt
          tail -60 build-apk.txt

      - name: ارسال لاگ به‌صورت کامنت PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          try:
              log = open('build-apk.txt', encoding='utf-8', errors='replace').read()
          except OSError:
              log = '(no log file)'
          body = '### APK build log (Flutter 3.47.5)\n\n```\n%s\n```\n' % log[-40000:]
          def post_comment(title, body):
              import json, os, urllib.request, urllib.error
              request = urllib.request.Request(
                  'https://api.github.com/repos/DnsChangerPM/Tel/issues/1/comments',
                  data=json.dumps({'body': body}).encode('utf-8'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                  },
                  method='POST')
              try:
                  with urllib.request.urlopen(request) as response:
                      print('comment posted:', response.status)
              except urllib.error.HTTPError as error:
                  print('comment failed:', error.code, error.read()[:300])

          post_comment('APK build log', body)
          PY

  diagnose-windows:
    name: diagnose windows runner
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'

      - name: اطلاعات محیط ساخت ویندوز
        continue-on-error: true
        shell: pwsh
        run: |
          $out = 'diag.txt'
          "=== vswhere -all -prerelease ===" | Out-File $out
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          "vswhere exists: $(Test-Path $vswhere)" | Out-File -Append $out
          & $vswhere -all -prerelease -format json 2>&1 | Out-File -Append $out
          "=== VS folders ===" | Out-File -Append $out
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-File -Append $out
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-File -Append $out
          "=== cmake versions found ===" | Out-File -Append $out
          & $vswhere -all -prerelease -find '**\cmake.exe' 2>&1 | Out-File -Append $out
          "=== runner os ===" | Out-File -Append $out
          "$env:ImageOS $env:ImageVersion" | Out-File -Append $out
          "=== flutter doctor -v ===" | Out-File -Append $out
          flutter doctor -v 2>&1 | Out-File -Append $out
          Get-Content $out

      - name: ارسال اطلاعات به‌صورت کامنت PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = Get-Content diag.txt -Raw -ErrorAction SilentlyContinue
          if (-not $log) { $log = '(no log file)' }
          if ($log.Length -gt 40000) { $log = $log.Substring($log.Length - 40000) }
          $fence = '```'
          $body = @{ body = "### Windows runner diagnostics (windows-latest)`n$fence`n$log`n$fence" } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/DnsChangerPM/Tel/issues/1/comments' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -Body $body -ContentType 'application/json'

  build-windows:
    name: build EXE on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['windows-2022', 'windows-latest']
    runs-on: ${{ matrix.runner }}
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'

      - name: ساخت EXE
        continue-on-error: true
        shell: pwsh
        run: |
          flutter build windows --release --build-name 0.0.1 --build-number 1 *> build-exe.txt
          "exit code: $LASTEXITCODE" | Out-File -Append build-exe.txt
          Get-Content build-exe.txt -Tail 60

      - name: ارسال لاگ به‌صورت کامنت PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          $log = Get-Content build-exe.txt -Raw -ErrorAction SilentlyContinue
          if (-not $log) { $log = '(no log file)' }
          if ($log.Length -gt 40000) { $log = $log.Substring($log.Length - 40000) }
          $fence = '```'
          $body = @{ body = "### EXE build log (Flutter 3.19.6, $env:RUNNER_LABEL)`n$fence`n$log`n$fence" } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/DnsChangerPM/Tel/issues/1/comments' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -Body $body -ContentType 'application/json'
