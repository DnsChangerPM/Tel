# فایل موقت عیب‌یابی: خروجی flutter analyze و flutter test را با هر دو نسخهٔ
# Flutter به‌صورت کامنت روی PR می‌فرستد تا از بیرون قابل خواندن باشد. بعد از
# رفع خطاها حذف می‌شود.

name: CI debug (temporary)

on:
  push:
    tags:
      - 'dbg-*'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: check ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.5', '3.19.6']
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}

      - name: pub get
        run: flutter pub get > "pubget-${{ matrix.flutter }}.txt" 2>&1 || true

      - name: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > "analyze-${{ matrix.flutter }}.txt" 2>&1 || true
          echo "===== analyze ${{ matrix.flutter }} ====="
          cat "analyze-${{ matrix.flutter }}.txt"

      - name: test
        continue-on-error: true
        run: |
          flutter test > "test-${{ matrix.flutter }}.txt" 2>&1 || true
          echo "===== test ${{ matrix.flutter }} ====="
          tail -80 "test-${{ matrix.flutter }}.txt"

      - name: ارسال خروجی به‌صورت کامنت PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLUTTER_VERSION: ${{ matrix.flutter }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          flutter = os.environ['FLUTTER_VERSION']

          def read(name):
              try:
                  return open('%s-%s.txt' % (name, flutter), encoding='utf-8').read()
              except OSError:
                  return '(no output)'

          body = (
              '### Flutter %s\n\n**flutter analyze**\n\n```\n%s\n```\n\n'
              '**flutter test**\n\n```\n%s\n```\n'
          ) % (flutter, read('analyze')[:25000], read('test')[:25000])
          request = urllib.request.Request(
              'https://api.github.com/repos/DnsChangerPM/Tel/issues/1/comments',
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
              method='POST')
          try:
              with urllib.request.urlopen(request) as response:
                  print('comment posted:', response.status)
          except urllib.error.HTTPError as error:
              print('comment failed:', error.code, error.read()[:500])
              raise
          PY
