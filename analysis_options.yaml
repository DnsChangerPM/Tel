# تنظیمات تحلیل کد Tel
#
# توجه: از پکیج بیرونی flutter_lints استفاده نمی‌کنیم تا پروژه هیچ وابستگی
# pub.dev نداشته باشد و ساخت در CI کاملاً آفلاین/قطعی باشد.

analyzer:
  errors:
    # کد ما باید هم با Flutter 3.19 (ساخت ویندوز) و هم با Flutter جدید
    # (ساخت اندروید) کامپایل شود؛ بنابراین هشدارهای منسوخ‌شدن نادیده گرفته
    # می‌شوند و خطا محسوب نمی‌شوند.
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
  exclude:
    - build/**
    - .dart_tool/**

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_types_as_parameter_names
    - await_only_futures
    - camel_case_types
    - camel_case_extensions
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_typing_uninitialized_variables
    - prefer_void_to_null
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - valid_regexps
